services:
  mongodb:
    image: mongo:7
    container_name: invoices-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - invoices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: invoices-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    networks:
      - invoices-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: invoices-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - invoices-network
    restart: unless-stopped

  server:
    container_name: invoices-server
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://root:example@mongodb:27017/invoices?authSource=admin
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - invoices-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    container_name: invoices-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    networks:
      - invoices-network
    depends_on:
      - server
    restart: unless-stopped

networks:
  invoices-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:

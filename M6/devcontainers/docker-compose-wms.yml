services:
  wms-postgres:
    image: postgres:17-alpine
    container_name: wms-postgres-container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: deliveroo
    ports:
      - "5432:5432"
    volumes:
      - wms-postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - deliveroo-network
    restart: unless-stopped

  wms-api-dev:
    container_name: wms-api-container
    profiles: [dev]
    build:
      context: ./wms-api
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - SERVICE_NAME=wms-api
      - POSTGRES_URL=postgresql+psycopg2://admin:strongpassword123@wms-postgres:5432/deliveroo
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./postgres:/app/postgres:ro
    networks:
      deliveroo-network:
        aliases:
          - wms-api
    develop:
      watch:
        - action: sync
          path: ./wms-api/src
          target: /app/src
        - action: rebuild
          path: ./wms-api/requirements.txt

  wms-api-prod:
    container_name: wms-api-prod-container
    profiles: [prod]
    build:
      context: ./wms-api
      dockerfile: Dockerfile
    command: gunicorn --bind 0.0.0.0:3001 --workers 4 --chdir /app/src application:app
    environment:
      - PORT=3001
      - SERVICE_NAME=wms-api
      - POSTGRES_URL=postgresql+psycopg2://admin:strongpassword123@wms-postgres:5432/deliveroo
    ports:
      - "3001:3001"
    networks:
      deliveroo-network:
        aliases:
          - wms-api

  wms-nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # This clears out the default configuration folder
      - ./nginx/empty:/etc/nginx/conf.d:ro
    networks:
      - deliveroo-network

  pgadmin:
    image: dpage/pgadmin4:9.4
    container_name: pgadmin-container
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - deliveroo-network
    depends_on:
      - wms-postgres
    restart: unless-stopped

networks:
  deliveroo-network:
    driver: bridge

volumes:
  wms-postgres_data:
  pgadmin_data:

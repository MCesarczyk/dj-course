openapi: 3.0.3
info:
  title: WMS API (Warehouse Management System)
  description: |
    API for warehouse management - employees, contractors, payments, storage event history.
  version: 1.0.0

servers:
  - url: /
    description: Base API URL

paths:
  # --- Health ---
  /health:
    get:
      summary: Service health check
      description: Returns service status, uptime, version, and dependency status (PostgreSQL).
      operationId: health
      tags:
        - Health
      responses:
        '200':
          description: Service is running correctly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service unavailable (e.g. PostgreSQL connection error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # --- Storage ---
  /storage/{record_id}/events:
    get:
      summary: Storage record event history
      description: Returns cargo event history for the given storage record.
      operationId: getStorageEventHistory
      tags:
        - Storage
      parameters:
        - name: record_id
          in: path
          required: true
          description: Storage record ID (storage_record_id)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of storage events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageEvent'

  # --- Storage operations (receipt / move / dispatch) ---
  /storage/receipts:
    post:
      summary: Receive goods onto a shelf (przyjęcie)
      description: Creates a storage record against a request; owner is derived from the request. Logs a RECEIVED event.
      operationId: receiveGoods
      tags: [StorageOperations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptCreate' }
      responses:
        '201': { description: Created storage record, content: { application/json: { schema: { $ref: '#/components/schemas/StorageRecord' } } } }
        '400': { description: Invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Request or shelf not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Shelf not ACTIVE / wrong warehouse / capacity exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /storage/records:
    get:
      summary: Storage-record register (open + closed), filterable
      description: >-
        Every storage record with its derived status. Unlike /inventory (current stock only),
        this includes dispatched/lost records. Filters: partyId, warehouseId, shelfId, status.
      operationId: listStorageRecords
      tags: [StorageOperations]
      parameters:
        - { name: partyId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: warehouseId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: shelfId, in: query, required: false, schema: { type: integer, format: int64 } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [STORED, DISPATCHED, DAMAGED, LOST] }
      responses:
        '200':
          description: List of storage records
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StorageRecord' } }
        '400': { description: Invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /storage/{record_id}:
    parameters:
      - name: record_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Storage record details
      operationId: getStorageRecord
      tags: [StorageOperations]
      responses:
        '200': { description: Storage record, content: { application/json: { schema: { $ref: '#/components/schemas/StorageRecord' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /storage/reservations/{reservation_id}/fulfill:
    parameters:
      - name: reservation_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Receive goods against a reservation (przyjęcie realizujące rezerwację)
      description: >-
        Converts an ACTIVE reservation into stored goods: creates a storage record on
        the reserved shelf (owner/request from the reservation), marks the reservation
        FULFILLED, and logs a RECEIVED event. Cargo defaults to the reserved amounts.
      operationId: fulfillReservation
      tags: [StorageOperations]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationFulfill' }
      responses:
        '201': { description: Created storage record, content: { application/json: { schema: { $ref: '#/components/schemas/StorageRecord' } } } }
        '400': { description: Invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Reservation or shelf not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Reservation not ACTIVE / shelf not ACTIVE / exceeds reserved / capacity, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /storage/{record_id}/move:
    parameters:
      - name: record_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Move stored goods to another shelf (przesunięcie)
      description: Relocates an open record within the same warehouse. Logs a MOVED event.
      operationId: moveGoods
      tags: [StorageOperations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        '200': { description: Updated record, content: { application/json: { schema: { $ref: '#/components/schemas/StorageRecord' } } } }
        '400': { description: Invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Record or target shelf not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Already dispatched / same shelf / not ACTIVE / cross-warehouse / capacity, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /storage/{record_id}/dispatch:
    parameters:
      - name: record_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Dispatch goods from the warehouse (wydanie)
      description: Closes an open record (sets exit date). Logs a DISPATCHED event.
      operationId: dispatchGoods
      tags: [StorageOperations]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchRequest' }
      responses:
        '200': { description: Dispatched record, content: { application/json: { schema: { $ref: '#/components/schemas/StorageRecord' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Already dispatched, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /storage/{record_id}/damage:
    parameters:
      - name: record_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Flag stored goods as damaged (uszkodzenie)
      description: Sets condition=DAMAGED. Goods stay on the shelf (still occupied). Logs a DAMAGED event.
      operationId: reportDamage
      tags: [StorageOperations]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionReport' }
      responses:
        '200': { description: Updated record, content: { application/json: { schema: { $ref: '#/components/schemas/StorageRecord' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Not on stock, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /storage/{record_id}/loss:
    parameters:
      - name: record_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Write off stored goods as lost (zaginięcie)
      description: Sets condition=LOST and actual_exit_date — removed from stock, distinct from DISPATCHED. Logs a LOST event.
      operationId: reportLoss
      tags: [StorageOperations]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionReport' }
      responses:
        '200': { description: Updated record, content: { application/json: { schema: { $ref: '#/components/schemas/StorageRecord' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: No longer on stock, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # --- Employees ---
  /employees:
    get:
      summary: Employee list
      description: Returns a list of all employees with their contact and role data.
      operationId: getEmployees
      tags:
        - Employees
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeListItem'

  /employees/{employee_id}:
    get:
      summary: Employee details
      description: Returns details of a single employee.
      operationId: getEmployee
      tags:
        - Employees
      parameters:
        - name: employee_id
          in: path
          required: true
          description: Employee ID (party_id)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Employee data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListItem'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Warehouse structure CRUD (Magazyn / Strefa / Rząd / Szafa / Półka) ---
  /warehouses:
    get:
      summary: List warehouses
      operationId: listWarehouses
      tags: [WarehouseStructure]
      parameters:
        - name: includeInactive
          in: query
          required: false
          description: Include soft-deleted (INACTIVE) warehouses
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Warehouse'
    post:
      summary: Create warehouse (with its location)
      operationId: createWarehouse
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseCreate'
      responses:
        '201':
          description: Created warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /warehouses/{warehouse_id}:
    parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Warehouse details
      operationId: getWarehouse
      tags: [WarehouseStructure]
      responses:
        '200':
          description: Warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update warehouse (name/description/status)
      operationId: updateWarehouse
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseUpdate'
      responses:
        '200':
          description: Updated warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Soft-delete warehouse (status -> INACTIVE)
      description: Blocked with 409 while the warehouse still has active zones.
      operationId: deleteWarehouse
      tags: [WarehouseStructure]
      responses:
        '204': { description: Soft-deleted }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Has active children, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /warehouses/{warehouse_id}/zones:
    parameters:
      - name: warehouse_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List zones of a warehouse
      operationId: listWarehouseZones
      tags: [WarehouseStructure]
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: List of zones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zone' }
        '404': { description: Warehouse not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Create zone in a warehouse
      operationId: createWarehouseZone
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneCreate' }
      responses:
        '201':
          description: Created zone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Warehouse not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /zones/{zone_id}:
    parameters:
      - name: zone_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Zone details
      operationId: getZone
      tags: [WarehouseStructure]
      responses:
        '200': { description: Zone, content: { application/json: { schema: { $ref: '#/components/schemas/Zone' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      summary: Update zone
      operationId: updateZone
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneUpdate' }
      responses:
        '200': { description: Updated zone, content: { application/json: { schema: { $ref: '#/components/schemas/Zone' } } } }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Soft-delete zone (blocked 409 if active aisles)
      operationId: deleteZone
      tags: [WarehouseStructure]
      responses:
        '204': { description: Soft-deleted }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Has active children, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /zones/{zone_id}/aisles:
    parameters:
      - name: zone_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List aisles of a zone
      operationId: listZoneAisles
      tags: [WarehouseStructure]
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: List of aisles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Aisle' } }
        '404': { description: Zone not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Create aisle in a zone
      operationId: createZoneAisle
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AisleCreate' }
      responses:
        '201': { description: Created aisle, content: { application/json: { schema: { $ref: '#/components/schemas/Aisle' } } } }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Zone not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /aisles/{aisle_id}:
    parameters:
      - name: aisle_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Aisle details
      operationId: getAisle
      tags: [WarehouseStructure]
      responses:
        '200': { description: Aisle, content: { application/json: { schema: { $ref: '#/components/schemas/Aisle' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      summary: Update aisle
      operationId: updateAisle
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AisleUpdate' }
      responses:
        '200': { description: Updated aisle, content: { application/json: { schema: { $ref: '#/components/schemas/Aisle' } } } }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Soft-delete aisle (blocked 409 if active racks)
      operationId: deleteAisle
      tags: [WarehouseStructure]
      responses:
        '204': { description: Soft-deleted }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Has active children, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /aisles/{aisle_id}/racks:
    parameters:
      - name: aisle_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List racks of an aisle
      operationId: listAisleRacks
      tags: [WarehouseStructure]
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: List of racks
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Rack' } }
        '404': { description: Aisle not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Create rack in an aisle
      operationId: createAisleRack
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RackCreate' }
      responses:
        '201': { description: Created rack, content: { application/json: { schema: { $ref: '#/components/schemas/Rack' } } } }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Aisle not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /racks/{rack_id}:
    parameters:
      - name: rack_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Rack details
      operationId: getRack
      tags: [WarehouseStructure]
      responses:
        '200': { description: Rack, content: { application/json: { schema: { $ref: '#/components/schemas/Rack' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      summary: Update rack
      operationId: updateRack
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RackUpdate' }
      responses:
        '200': { description: Updated rack, content: { application/json: { schema: { $ref: '#/components/schemas/Rack' } } } }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Soft-delete rack (blocked 409 if active shelves)
      operationId: deleteRack
      tags: [WarehouseStructure]
      responses:
        '204': { description: Soft-deleted }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Has active children, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /racks/{rack_id}/shelves:
    parameters:
      - name: rack_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List shelves of a rack (with occupancy)
      operationId: listRackShelves
      tags: [WarehouseStructure]
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: List of shelves
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Shelf' } }
        '404': { description: Rack not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Create shelf in a rack
      operationId: createRackShelf
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelfCreate' }
      responses:
        '201': { description: Created shelf, content: { application/json: { schema: { $ref: '#/components/schemas/Shelf' } } } }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Rack not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /racks/{rack_id}/shelves:bulk:
    parameters:
      - name: rack_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Bulk-provision N identical shelves in a rack
      operationId: bulkCreateRackShelves
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelfBulkCreate' }
      responses:
        '201':
          description: Created shelves
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Shelf' } }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Rack not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /shelves/{shelf_id}:
    parameters:
      - name: shelf_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Shelf details (capacity + live occupancy + locationCode)
      operationId: getShelf
      tags: [WarehouseStructure]
      responses:
        '200': { description: Shelf, content: { application/json: { schema: { $ref: '#/components/schemas/Shelf' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      summary: Update shelf
      operationId: updateShelf
      tags: [WarehouseStructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelfUpdate' }
      responses:
        '200': { description: Updated shelf, content: { application/json: { schema: { $ref: '#/components/schemas/Shelf' } } } }
        '400': { description: Invalid request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Soft-delete shelf (blocked 409 if active reservations/open records)
      operationId: deleteShelf
      tags: [WarehouseStructure]
      responses:
        '204': { description: Soft-deleted }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Has active reservations or open storage records, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # --- Inventory state (read layer over storage_record) ---
  /warehouses/{warehouse_id}/employees:
    parameters:
      - name: warehouse_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Employees assigned to a warehouse
      operationId: getWarehouseEmployees
      tags: [WarehouseStructure]
      responses:
        '200':
          description: List of warehouse employees
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EmployeeListItem' } }
        '404': { description: Warehouse not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /warehouses/{warehouse_id}/inventory:
    parameters:
      - name: warehouse_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Stored-goods rollup per zone for a warehouse
      operationId: getWarehouseInventory
      tags: [Inventory]
      responses:
        '200': { description: Inventory rollup, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseInventory' } } } }
        '404': { description: Warehouse not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /inventory:
    get:
      summary: Currently stored cargo lots (filterable)
      description: Open storage records, optionally filtered by party / warehouse / zone / shelf. Each item carries its locationCode.
      operationId: listInventory
      tags: [Inventory]
      parameters:
        - name: partyId
          in: query
          required: false
          description: Owner of the cargo (answers "where is customer X's goods?")
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: zoneId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: shelfId
          in: query
          required: false
          description: Cargo on a specific shelf (replaces the old /shelves/{id}/contents)
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: List of stored cargo lots
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StorageRecordItem' } }
        '400': { description: Invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # --- Contractors ---
  /contractors:
    get:
      summary: Contractor list
      description: Returns a list of contractors (companies) with basic data.
      operationId: getContractors
      tags:
        - Contractors
      responses:
        '200':
          description: List of contractors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractorSummary'
        '500':
          description: Data validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contractors/{id}:
    get:
      summary: Contractor details
      description: Returns full contractor data including addresses and representative employees.
      operationId: getContractorDetails
      tags:
        - Contractors
      parameters:
        - name: id
          in: path
          required: true
          description: Contractor ID (party_id)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Contractor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractorDetails'
        '404':
          description: Contractor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Data validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update contractor status
      description: Updates contractor status (ACTIVE/INACTIVE).
      operationId: updateContractorStatus
      tags:
        - Contractors
      parameters:
        - name: id
          in: path
          required: true
          description: Contractor ID (party_id)
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractorStatusUpdate'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractorStatusUpdateResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contractor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- Payments ---
  /payments:
    get:
      summary: Payment list
      description: Returns a list of payments with optional filtering by status and party_id.
      operationId: getPaymentsList
      tags:
        - Payments
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by payment status
          schema:
            type: string
        - name: party_id
          in: query
          required: false
          description: Filter by party ID (contractor)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'

components:
  schemas:
    # --- Health ---
    HealthStatus:
      type: object
      required:
        - status
        - timestamp
        - uptime_seconds
        - dependencies
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          description: Overall service status
        timestamp:
          type: number
          format: double
          description: Unix timestamp
        uptime_seconds:
          type: integer
          description: Service uptime in seconds
        version:
          type: string
          description: Application version (e.g. from VERSION env variable)
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [UP, DOWN]
          description: Dependency status (e.g. postgres)

    # --- Storage ---
    StorageEvent:
      type: object
      properties:
        event_id:
          type: integer
          format: int64
        storage_record_id:
          type: integer
          format: int64
        event_type_id:
          type: integer
          format: int64
        event_time:
          type: string
          format: date-time
        party_id:
          type: integer
          format: int64
        details:
          type: object
          nullable: true

    # --- Employees ---
    EmployeeListItem:
      type: object
      properties:
        employee_id:
          type: integer
          format: int64
        employee_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        hire_date:
          type: string
          format: date-time
          nullable: true
        roles:
          type: string
          description: Roles separated by commas

    # --- Contractors (contracts) ---
    ContractorStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    Contact:
      type: object
      properties:
        type:
          type: string
          nullable: true
        details:
          type: string
          nullable: true

    ContractorSummary:
      type: object
      required:
        - id
        - name
        - status
        - contacts
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ContractorStatus'
        tax_id_number:
          type: string
          nullable: true
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'

    AddressDetails:
      type: object
      properties:
        address_id:
          type: string
          nullable: true
        street_address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        address_type:
          type: string
          nullable: true

    EmployeeSummaryEmployeeData:
      type: object
      properties:
        type:
          type: string
          nullable: true
        job_title:
          type: string
          nullable: true

    EmployeeSummary:
      type: object
      properties:
        employee_id:
          type: string
          nullable: true
        employee_name:
          type: string
          nullable: true
        employee_data:
          $ref: '#/components/schemas/EmployeeSummaryEmployeeData'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
          nullable: true

    ContractorDetails:
      type: object
      required:
        - id
        - name
        - status
        - contacts
        - addresses
        - employees
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ContractorStatus'
        tax_id_number:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressDetails'
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeSummary'

    ContractorStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ContractorStatus'

    ContractorStatusUpdateResponse:
      type: object
      properties:
        message:
          type: string
          example: "Contractor 123 status updated successfully to ACTIVE"

    # --- Payments ---
    Payment:
      type: object
      properties:
        payment_id:
          type: integer
          format: int64
        storage_record_id:
          type: integer
          format: int64
          nullable: true
        party_id:
          type: integer
          format: int64
          nullable: true
        amount:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        payment_date:
          type: string
          format: date-time
          nullable: true
        external_reference:
          type: string
          nullable: true

    # --- Warehouse structure ---
    StructureStatus:
      type: string
      enum: [ACTIVE, BLOCKED, MAINTENANCE, INACTIVE]
      description: |
        Lifecycle status. ACTIVE = in service; BLOCKED = temporarily unavailable;
        MAINTENANCE = out for repair; INACTIVE = soft-deleted (set by DELETE).

    LocationInfo:
      type: object
      required: [address, city, postalCode, country]
      properties:
        address: { type: string }
        city: { type: string }
        postalCode: { type: string }
        country: { type: string }

    Warehouse:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/StructureStatus' }
        location: { $ref: '#/components/schemas/LocationInfo' }
        zoneCount: { type: integer, nullable: true, description: Active zones in this warehouse }

    WarehouseCreate:
      type: object
      required: [name, description, location]
      properties:
        name: { type: string }
        description: { type: string }
        location: { $ref: '#/components/schemas/LocationInfo' }

    WarehouseUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/StructureStatus' }

    Zone:
      type: object
      required: [id, warehouseId, name, status]
      properties:
        id: { type: string }
        warehouseId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/StructureStatus' }
        aisleCount: { type: integer, nullable: true }

    ZoneCreate:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }

    ZoneUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/StructureStatus' }

    Aisle:
      type: object
      required: [id, zoneId, label, width, widthUnit, status]
      properties:
        id: { type: string }
        zoneId: { type: string }
        label: { type: string }
        width: { type: integer }
        widthUnit: { type: string }
        status: { $ref: '#/components/schemas/StructureStatus' }
        rackCount: { type: integer, nullable: true }

    AisleCreate:
      type: object
      required: [label, width, widthUnit]
      properties:
        label: { type: string }
        width: { type: integer, minimum: 1 }
        widthUnit: { type: string }

    AisleUpdate:
      type: object
      properties:
        label: { type: string }
        width: { type: integer, minimum: 1 }
        widthUnit: { type: string }
        status: { $ref: '#/components/schemas/StructureStatus' }

    Rack:
      type: object
      required: [id, aisleId, label, maxHeight, heightUnit, status]
      properties:
        id: { type: string }
        aisleId: { type: string }
        label: { type: string }
        maxHeight: { type: integer }
        heightUnit: { type: string }
        status: { $ref: '#/components/schemas/StructureStatus' }
        shelfCount: { type: integer, nullable: true }

    RackCreate:
      type: object
      required: [label, maxHeight, heightUnit]
      properties:
        label: { type: string }
        maxHeight: { type: integer, minimum: 1 }
        heightUnit: { type: string }

    RackUpdate:
      type: object
      properties:
        label: { type: string }
        maxHeight: { type: integer, minimum: 1 }
        heightUnit: { type: string }
        status: { $ref: '#/components/schemas/StructureStatus' }

    Shelf:
      type: object
      required: [id, rackId, level, status, maxWeight, maxVolume]
      properties:
        id: { type: string }
        rackId: { type: string }
        level: { type: string }
        locationCode: { type: string, nullable: true, description: 'Human-readable address: zone-aisle-rack-level' }
        status: { $ref: '#/components/schemas/StructureStatus' }
        maxWeight: { type: number, description: Nominal weight capacity }
        maxVolume: { type: number, description: Nominal volume capacity }
        reservedWeight: { type: number, description: Booked capacity — sum of ACTIVE reservations }
        reservedVolume: { type: number }
        availableWeight: { type: number, description: maxWeight - reservedWeight }
        availableVolume: { type: number }
        occupiedWeight: { type: number, description: Physically stored — sum of open storage records }
        occupiedVolume: { type: number }
        storedRecordCount: { type: integer, description: Number of cargo lots currently on the shelf }

    ShelfCreate:
      type: object
      required: [level, maxWeight, maxVolume]
      properties:
        level: { type: string }
        maxWeight: { type: number, exclusiveMinimum: 0 }
        maxVolume: { type: number, exclusiveMinimum: 0 }

    ShelfBulkCreate:
      type: object
      required: [count, maxWeight, maxVolume]
      properties:
        count: { type: integer, minimum: 1, maximum: 100 }
        maxWeight: { type: number, exclusiveMinimum: 0 }
        maxVolume: { type: number, exclusiveMinimum: 0 }
        levelPrefix: { type: string, default: 'L', description: 'Levels generated as {prefix}{1..count}' }

    ShelfUpdate:
      type: object
      properties:
        level: { type: string }
        maxWeight: { type: number, exclusiveMinimum: 0 }
        maxVolume: { type: number, exclusiveMinimum: 0 }
        status: { $ref: '#/components/schemas/StructureStatus' }

    # --- Inventory state ---
    StorageRecordItem:
      type: object
      required: [recordId, partyId, cargoWeight, cargoVolume]
      description: A single cargo lot currently stored on a shelf.
      properties:
        recordId: { type: string }
        partyId: { type: string, description: Owner (customer) of the cargo }
        partyName: { type: string, nullable: true }
        warehouseId: { type: string, nullable: true }
        shelfId: { type: string, nullable: true }
        locationCode: { type: string, nullable: true, description: 'zone-aisle-rack-level' }
        cargoDescription: { type: string, nullable: true }
        cargoWeight: { type: number }
        cargoVolume: { type: number }
        entryDate: { type: string, format: date-time, nullable: true }

    ZoneInventory:
      type: object
      required: [zoneId, zoneName, recordCount, totalWeight, totalVolume]
      properties:
        zoneId: { type: string }
        zoneName: { type: string }
        recordCount: { type: integer }
        totalWeight: { type: number }
        totalVolume: { type: number }

    WarehouseInventory:
      type: object
      required: [warehouseId, recordCount, totalWeight, totalVolume, zones]
      properties:
        warehouseId: { type: string }
        recordCount: { type: integer }
        totalWeight: { type: number }
        totalVolume: { type: number }
        zones:
          type: array
          items: { $ref: '#/components/schemas/ZoneInventory' }

    # --- Storage operations ---
    ReceiptCreate:
      type: object
      required: [requestId, shelfId, cargoDescription, cargoWeight, cargoVolume]
      properties:
        requestId: { type: string }
        shelfId: { type: string }
        cargoDescription: { type: string }
        cargoWeight: { type: number, exclusiveMinimum: 0 }
        cargoVolume: { type: number, exclusiveMinimum: 0 }
        entryDate: { type: string, format: date-time, nullable: true, description: Defaults to now }

    ReservationFulfill:
      type: object
      description: All fields optional; cargo defaults to the reserved amounts and must not exceed them.
      properties:
        cargoDescription: { type: string, nullable: true }
        cargoWeight: { type: number, exclusiveMinimum: 0, nullable: true }
        cargoVolume: { type: number, exclusiveMinimum: 0, nullable: true }
        entryDate: { type: string, format: date-time, nullable: true }

    MoveRequest:
      type: object
      required: [targetShelfId]
      properties:
        targetShelfId: { type: string }
        note: { type: string, nullable: true }

    DispatchRequest:
      type: object
      properties:
        exitDate: { type: string, format: date-time, nullable: true, description: Defaults to now }
        note: { type: string, nullable: true }

    ConditionReport:
      type: object
      description: Body for /damage and /loss — an optional operator note.
      properties:
        note: { type: string, nullable: true }

    StorageRecord:
      type: object
      required: [recordId, requestId, partyId, shelfId, cargoWeight, cargoVolume, status]
      properties:
        recordId: { type: string }
        requestId: { type: string }
        partyId: { type: string }
        partyName: { type: string, nullable: true }
        shelfId: { type: string }
        locationCode: { type: string, nullable: true }
        cargoDescription: { type: string, nullable: true }
        cargoWeight: { type: number }
        cargoVolume: { type: number }
        entryDate: { type: string, format: date-time, nullable: true }
        exitDate: { type: string, format: date-time, nullable: true }
        condition: { type: string, enum: [GOOD, DAMAGED, LOST] }
        status: { type: string, enum: [STORED, DISPATCHED, DAMAGED, LOST] }

    # --- Errors ---
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

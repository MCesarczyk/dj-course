server {
    listen 8080;
    server_name localhost;

    location = / {
        return 301 $scheme://$http_host/wms/;
    }

    # JS and CSS are pre-gzip-compressed in the Docker build stage
    location ~* ^/wms/(.+\.(?:js|css))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Encoding gzip;
        add_header Vary Accept-Encoding;
    }

    # Other hashed assets (fonts, images) — served as-is, already compact formats
    location ~* ^/wms/(.+\.(?:woff2?|ttf|eot|ico|png|jpg|svg|webp))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes + index.html — no cache so new deployments are visible immediately
    location /wms/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /wms/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
    }
}

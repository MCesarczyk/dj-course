server {
    listen 8080;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Redirect bare root to the app
    location = / {
        return 301 /wms/;
    }

    # Content-hashed assets (main.abc123.js, styles.xyz.css, …) — safe to cache forever
    location ~* ^/wms/(.+\.(?:js|css|woff2?|ttf|eot|ico|png|jpg|svg|webp))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes and index.html — must not be cached so new deployments are visible immediately
    location /wms/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
    }
}

openapi: 3.1.0
info:
  title: WMS API (Warehouse Management System)
  description: API for warehouse management - employees, contractors, payments, storage
    event history, inventory state.
  version: 1.0.0
servers:
- url: /
  description: Base API URL
paths:
  /health:
    get:
      tags:
      - Health
      summary: Service health check
      description: Returns service status, uptime, version, and dependency status
        (PostgreSQL).
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /payments:
    get:
      tags:
      - Payments
      summary: Payment list
      description: Returns a list of payments with optional filtering by status and
        party_id.
      operationId: getPaymentsList
      parameters:
      - name: status
        in: query
        description: Filter by payment status
        required: false
        schema:
          title: Status
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by payment status
          default: null
      - name: party_id
        in: query
        description: Filter by party ID (contractor)
        required: false
        schema:
          title: Party Id
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by party ID (contractor)
          default: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/{record_id}:
    get:
      tags:
      - StorageOperations
      summary: Storage record details
      operationId: getStorageRecord
      parameters:
      - name: record_id
        in: path
        description: Storage record ID (storage_record_id)
        required: true
        schema:
          title: Record Id
          type: integer
          description: Storage record ID (storage_record_id)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/records:
    get:
      tags:
      - StorageOperations
      summary: Storage-record register (open + closed), filterable
      description: 'Every storage record with its derived status. Unlike /inventory
        (current stock only), this includes dispatched/lost records. Filters: partyId,
        warehouseId, shelfId, status.'
      operationId: listStorageRecords
      parameters:
      - name: partyId
        in: query
        required: false
        schema:
          title: Partyid
          anyOf:
          - type: integer
          - type: 'null'
          default: null
      - name: warehouseId
        in: query
        required: false
        schema:
          title: Warehouseid
          anyOf:
          - type: integer
          - type: 'null'
          default: null
      - name: shelfId
        in: query
        required: false
        schema:
          title: Shelfid
          anyOf:
          - type: integer
          - type: 'null'
          default: null
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RecordStatus'
          - type: 'null'
          default: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecordList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/{record_id}/events:
    get:
      tags:
      - Storage
      summary: Storage record event history
      description: Returns cargo event history for the given storage record.
      operationId: getStorageEventHistory
      parameters:
      - name: record_id
        in: path
        description: Storage record ID (storage_record_id)
        required: true
        schema:
          title: Record Id
          type: integer
          description: Storage record ID (storage_record_id)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageEventList'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/receipts:
    post:
      tags:
      - StorageOperations
      summary: Receive goods onto a shelf (przyjęcie)
      description: Creates a storage record against a request; owner is derived from
        the request. Logs a RECEIVED event.
      operationId: receiveGoods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptCreate'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/reservations/{reservation_id}/fulfill:
    post:
      tags:
      - StorageOperations
      summary: Receive goods against a reservation (przyjęcie realizujące rezerwację)
      description: 'Converts an ACTIVE reservation into stored goods: creates a storage
        record on the reserved shelf (owner/request from the reservation), marks the
        reservation FULFILLED, and logs a RECEIVED event. Cargo defaults to the reserved
        amounts.'
      operationId: fulfillReservation
      parameters:
      - name: reservation_id
        in: path
        required: true
        schema:
          title: Reservation Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationFulfill'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/{record_id}/move:
    post:
      tags:
      - StorageOperations
      summary: Move stored goods to another shelf (przesunięcie)
      description: Relocates an open record within the same warehouse. Logs a MOVED
        event.
      operationId: moveGoods
      parameters:
      - name: record_id
        in: path
        description: Storage record ID (storage_record_id)
        required: true
        schema:
          title: Record Id
          type: integer
          description: Storage record ID (storage_record_id)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/{record_id}/dispatch:
    post:
      tags:
      - StorageOperations
      summary: Dispatch goods from the warehouse (wydanie)
      description: Closes an open record (sets exit date). Logs a DISPATCHED event.
      operationId: dispatchGoods
      parameters:
      - name: record_id
        in: path
        description: Storage record ID (storage_record_id)
        required: true
        schema:
          title: Record Id
          type: integer
          description: Storage record ID (storage_record_id)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/{record_id}/damage:
    post:
      tags:
      - StorageOperations
      summary: Flag stored goods as damaged (uszkodzenie)
      description: Sets condition=DAMAGED. Goods stay on the shelf (still occupied).
        Logs a DAMAGED event.
      operationId: reportDamage
      parameters:
      - name: record_id
        in: path
        description: Storage record ID (storage_record_id)
        required: true
        schema:
          title: Record Id
          type: integer
          description: Storage record ID (storage_record_id)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionReport'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /storage/{record_id}/loss:
    post:
      tags:
      - StorageOperations
      summary: Write off stored goods as lost (zaginięcie)
      description: Sets condition=LOST and actual_exit_date — removed from stock,
        distinct from DISPATCHED. Logs a LOST event.
      operationId: reportLoss
      parameters:
      - name: record_id
        in: path
        description: Storage record ID (storage_record_id)
        required: true
        schema:
          title: Record Id
          type: integer
          description: Storage record ID (storage_record_id)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionReport'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /employees:
    get:
      tags:
      - Employees
      summary: Employee list
      description: Returns a list of all employees with their contact and role data.
      operationId: getEmployees
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /employees/{employee_id}:
    get:
      tags:
      - Employees
      summary: Employee details
      description: Returns details of a single employee.
      operationId: getEmployee
      parameters:
      - name: employee_id
        in: path
        description: Employee ID (party_id)
        required: true
        schema:
          title: Employee Id
          type: integer
          description: Employee ID (party_id)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListItem'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /contractors:
    get:
      tags:
      - Contractors
      summary: Contractor list
      description: Returns a list of contractors (companies) with basic data.
      operationId: getContractors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractorSummaryList'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /contractors/{id}:
    get:
      tags:
      - Contractors
      summary: Contractor details
      description: Returns full contractor data including addresses and representative
        employees.
      operationId: getContractorDetails
      parameters:
      - name: id
        in: path
        description: Contractor ID (party_id)
        required: true
        schema:
          title: Id
          type: integer
          description: Contractor ID (party_id)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
    patch:
      tags:
      - Contractors
      summary: Update contractor status
      description: Updates contractor status (ACTIVE/INACTIVE).
      operationId: updateContractorStatus
      parameters:
      - name: id
        in: path
        description: Contractor ID (party_id)
        required: true
        schema:
          title: Id
          type: integer
          description: Contractor ID (party_id)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractorStatusUpdate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractorStatusUpdateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /warehouses:
    get:
      tags:
      - WarehouseStructure
      summary: List warehouses
      operationId: listWarehouses
      parameters:
      - name: includeInactive
        in: query
        description: Include soft-deleted (INACTIVE) rows
        required: false
        schema:
          title: Includeinactive
          type: boolean
          description: Include soft-deleted (INACTIVE) rows
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseList'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
    post:
      tags:
      - WarehouseStructure
      summary: Create warehouse (with its location)
      operationId: createWarehouse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseCreate'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /warehouses/{warehouse_id}:
    get:
      tags:
      - WarehouseStructure
      summary: Warehouse details
      operationId: getWarehouse
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          title: Warehouse Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
    delete:
      tags:
      - WarehouseStructure
      summary: Soft-delete warehouse (status -> INACTIVE)
      description: Blocked with 409 while the warehouse still has active zones.
      operationId: deleteWarehouse
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          title: Warehouse Id
          type: integer
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
    patch:
      tags:
      - WarehouseStructure
      summary: Update warehouse (name/description/status)
      operationId: updateWarehouse
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          title: Warehouse Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseUpdate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /warehouses/{warehouse_id}/employees:
    get:
      tags:
      - WarehouseStructure
      summary: Employees assigned to a warehouse
      description: Employees assigned to a warehouse, with their roles.
      operationId: getWarehouseEmployees
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          title: Warehouse Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /warehouses/{warehouse_id}/inventory:
    get:
      tags:
      - Inventory
      summary: Stored-goods rollup per zone for a warehouse
      description: Stored-goods rollup (open storage records) aggregated per active
        zone.
      operationId: getWarehouseInventory
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          title: Warehouse Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseInventory'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /warehouses/{warehouse_id}/zones:
    get:
      tags:
      - WarehouseStructure
      summary: List zones of a warehouse
      operationId: listWarehouseZones
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          title: Warehouse Id
          type: integer
      - name: includeInactive
        in: query
        description: Include soft-deleted (INACTIVE) rows
        required: false
        schema:
          title: Includeinactive
          type: boolean
          description: Include soft-deleted (INACTIVE) rows
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneList'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
    post:
      tags:
      - WarehouseStructure
      summary: Create zone in a warehouse
      operationId: createWarehouseZone
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          title: Warehouse Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneCreate'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationErrorModel'
  /zones/{zone_id}:
    get:
      tags:
      - WarehouseStructure
      summary: Zone details
      operationId: getZone
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          title: Zone Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:

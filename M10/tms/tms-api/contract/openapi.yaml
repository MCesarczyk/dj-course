        status:
          type: string
          nullable: true
          description: License status (e.g. active)
          example: active
        code:
          type: string
          nullable: true
          description: License type code
          example: C
        name:
          type: string
          nullable: true
          description: License type name
          example: Prawo jazdy kat. C
        description:
          type: string
          nullable: true
          description: License type description
          example: Pojazdy ciężarowe powyżej 3,5t
    DriverDetail:
      type: object
      description: Full driver record including associated licenses (returned by GET /drivers/{id}).
      required:
        - id
        - licenses
      properties:
        id:
          type: integer
          description: Unique driver identifier
          example: 1
        first_name:
          type: string
          nullable: true
          maxLength: 50
          description: Driver first name
          example: Matt
        last_name:
          type: string
          nullable: true
          maxLength: 50
          description: Driver last name
          example: Jerde
        email:
          type: string
          nullable: true
          maxLength: 100
          description: Driver email address
          example: celiawalker@swift.net
        phone:
          type: string
          nullable: true
          maxLength: 20
          description: Driver phone number
          example: '4111234962'
        contract_type:
          type: string
          nullable: true
          maxLength: 20
          description: Contract type (e.g. CONTRACTOR, FULL_TIME)
          example: CONTRACTOR
        status:
          type: string
          nullable: true
          maxLength: 20
          description: Driver status
          example: ON_ROUTE
        licenses:
          type: array
          description: Associated driver licenses with type details
          items:
            $ref: '#/components/schemas/DriverLicense'
    TransportationOrder:
      type: object
      description: A single transportation order as returned by the API.
      required:
        - id
        - order_number
        - customer_id
        - status
        - amount
        - order_date
      properties:
        id:
          type: integer
          description: Unique order identifier
          example: 472
        order_number:
          type: string
          maxLength: 20
          description: Human-readable order number (e.g.
          example: '#00472'
        customer_id:
          type: integer
          description: ID of the customer who placed the order
          example: 1
        driver_id:
          type: integer
          nullable: true
          description: ID of the driver assigned to this order. Null when no driver has been assigned yet.
          example: 7
        status:
          type: string
          maxLength: 20
          description: Order status (e.g. DELIVERED, PENDING)
          example: DELIVERED
        amount:
          type: string
          description: |
            Order total amount. Returned as a decimal string (e.g. "43.19") because Postgres numeric is serialised as a string by the pg driver.
          example: '43.19'
        order_date:
          type: string
          format: date-time
          description: When the order was placed (ISO 8601)
          example: '2025-11-25T22:31:47.000Z'
        expected_delivery:
          type: string
          format: date-time
          nullable: true
          description: Expected delivery date (ISO 8601; Postgres date may be serialised with time component)
          example: '2025-12-02T00:00:00.000Z'
        shipping_address:
          type: string
          maxLength: 255
          nullable: true
          description: Delivery street address
          example: 6806 East Landchester, Plano, Utah 10652
        shipping_city:
          type: string
          maxLength: 100
          nullable: true
          description: Delivery city
          example: Plano
        shipping_state:
          type: string
          maxLength: 50
          nullable: true
          description: Delivery state or region
          example: Utah
        shipping_zip_code:
          type: string
          maxLength: 20
          nullable: true
          description: Delivery postal code
          example: '10652'
        shipping_method:
          type: string
          maxLength: 50
          nullable: true
          description: Shipping method name
          example: Standard Delivery
        tracking_number:
          type: string
          maxLength: 50
          nullable: true
          description: Carrier tracking number
          example: SR0472
    AssignDriverInput:
      type: object
      description: Payload for assigning a driver to a transportation order.
      required:
        - driver_id
      properties:
        driver_id:
          type: integer
          description: ID of the driver to assign to the order.
          example: 7
    Notification:
      type: object
      description: A single notification as returned by the API.
      required:
        - id
        - user_id
        - type
        - message
        - created_at
        - is_read
      properties:
        id:
          type: integer
          description: Unique notification identifier
          example: 115
        user_id:
          type: integer
          description: ID of the user who receives the notification
          example: 1
        type:
          type: string
          maxLength: 20
          description: Notification type (e.g. warning, success)
          example: warning
        message:
          type: string
          description: Notification message content
          example: Low fuel alert for assigned truck
        created_at:
          type: string
          format: date-time
          description: When the notification was created (ISO 8601)
          example: '2026-03-13T19:10:40.000Z'
        is_read:
          type: boolean
          description: Whether the notification has been read
          example: false
    NotificationListResponse:
      type: object
      description: Paginated list of notifications.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CarrierType:
      type: string
      description: |
        Supported load-carrier types. MODULAR carriers are semi-trailers (need a separate tractor unit); MONOLITHIC carriers are self-contained rigid vehicle bodies. These are generic loadable-space categories — concrete brand-models live in the vehicles catalog.
      enum:
        - standard-curtainside
        - mega
        - reefer
        - van
        - box-truck
    CreateLoadPlanInput:
      type: object
      description: Payload for creating a new load plan.
      required:
        - carrierType
      properties:
        carrierType:
          $ref: '#/components/schemas/CarrierType'
    CreateLoadPlanResponse:
      type: object
      description: Identifier of the newly created load plan.
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the created load plan
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    WeightUnit:
      type: string
      description: Unit of weight measurement
      enum:
        - KG
        - TONNE
        - LB
      default: KG
    CargoLoadPlanStatus:
      type: string
      description: Current status of the load plan
      enum:
        - DRAFT
        - FINALIZED
    VehicleClass:
      type: string
      description: |
        Shape of the carrier: MONOLITHIC (single self-contained vehicle body) or MODULAR (a towed semi-trailer that requires a tractor unit).
      enum:
        - MONOLITHIC
        - MODULAR
    CarrierReadModel:
      type: object
      description: Details of the load carrier assigned to the load plan.
      required:
        - type
        - vehicleClass
        - requiresTractor
        - canCarryPallets
        - maxWeightCapacityKg
        - widthMm
        - heightMm
        - maxLdm
      properties:
        type:
          $ref: '#/components/schemas/CarrierType'
        vehicleClass:
          $ref: '#/components/schemas/VehicleClass'
        requiresTractor:
          type: boolean
          description: |
            True when the carrier is MODULAR (a semi-trailer) and therefore needs a separate tractor unit to be moved. This module does not reserve the tractor; the flag signals the requirement to downstream fleet/dispatch.
          example: true
        canCarryPallets:
          type: boolean
          example: true
        maxWeightCapacityKg:
          type: number
          description: Maximum weight capacity in kilograms
          example: 24000
        widthMm:
          type: integer
          description: Internal loading-space width in millimetres
          example: 2480
        heightMm:
          type: integer
          description: Internal loading-space height in millimetres
          example: 2700
        maxLdm:
          type: number
          description: Maximum loading metres (LDM). For sub-2.4 m bodies (vans) this is an approximation.
          example: 13.6
    CargoType:
      type: string
      description: Type of cargo being transported
      enum:
        - FOOD
        - CHEMICAL
        - ELECTRONICS
        - ADR
        - GENERAL
    PalletUnitReadModel:
      type: object
      description: A single pallet unit assigned to a load plan.
      required:
        - id
        - palletLabel
        - cargoType
        - weight
        - totalHeightMm
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the pallet unit
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        palletLabel:
          type: string
          description: Human-readable label of the pallet spec (e.g. "EPAL 1")
          example: EPAL 1
        cargoType:
          $ref: '#/components/schemas/CargoType'
        weight:
          type: number
          description: Weight of the cargo on this pallet, expressed in the unit specified by the weightUnit field on the parent CargoLoadPlanReadModel
          minimum: 0
          exclusiveMinimum: true
          example: 600
        totalHeightMm:
          type: integer
          description: Total height of pallet + cargo in millimetres
          minimum: 0
          exclusiveMinimum: true
          example: 1400
        description:
          type: string
          nullable: true
          description: Human-readable product description (e.g. "FOOD – warzywa")
    CargoLoadPlanReadModel:
      type: object
      description: Full state of a cargo load plan.
      required:
        - id
        - status
        - version
        - weightUnit
        - carrier
        - currentLdm
        - plannedWeight
        - units
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the load plan
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        status:
          $ref: '#/components/schemas/CargoLoadPlanStatus'
        version:
          type: integer
          description: Optimistic concurrency version of the load plan
          minimum: 0
          example: 3
        weightUnit:
          $ref: '#/components/schemas/WeightUnit'
        carrier:
          $ref: '#/components/schemas/CarrierReadModel'
        currentLdm:
          type: number
          description: Currently used loading metres
          minimum: 0
          example: 2.4
        plannedWeight:
          type: number
          description: Total weight of all assigned cargo units, expressed in the unit given by weightUnit
          minimum: 0
          example: 600
        units:
          type: array
          description: Cargo units assigned to this plan
          items:
            $ref: '#/components/schemas/PalletUnitReadModel'
    PalletType:
      type: string
      description: Supported pallet types
      enum:
        - epal1
        - industrial
        - half
        - cp1
        - cp3
        - h1
    AddCargoInput:
      type: object
      description: Payload for adding a cargo unit to a load plan.
      required:
        - palletType
        - cargoType
        - weightKg
        - cargoHeightMm
      properties:
        palletType:
          $ref: '#/components/schemas/PalletType'
        cargoType:
          $ref: '#/components/schemas/CargoType'
        weightKg:
          type: number
          description: Weight of the cargo in kilograms
          minimum: 0
          exclusiveMinimum: true
          example: 600
        cargoHeightMm:
          type: integer
          description: Height of the cargo (without pallet) in millimetres
          minimum: 0
          exclusiveMinimum: true
          example: 1200
    ChangeCarrierInput:
      type: object
      description: Payload for changing the carrier type on a load plan.
      required:
        - carrierType
      properties:
        carrierType:
          $ref: '#/components/schemas/CarrierType'
    HealthResponse:
      type: object
      description: Health check response body.
      required:
        - status
        - service
      properties:
        status:
          type: string
          description: Health status (always "ok" when the service is running)
          example: ok
        service:
          type: string
          description: Service name (from SERVICE_NAME env or default tms-api)
          example: tms-api

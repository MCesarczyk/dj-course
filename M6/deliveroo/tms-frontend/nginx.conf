server {
    listen 8080;
    server_name localhost;

    # JS and CSS are pre-gzip-compressed in the Docker build stage
    location ~* ^/assets/(.+\.(?:js|css))$ {
        alias /usr/share/nginx/html/assets/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Encoding gzip;
        add_header Vary Accept-Encoding;
    }

    # Other hashed assets (fonts, images, media) — served as-is
    location ~* ^/assets/(.+\.(?:woff2?|ttf|eot|ico|png|jpg|svg|webp|mp4|webm))$ {
        alias /usr/share/nginx/html/assets/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — forward to tms-api, matching Vite dev proxy behaviour
    location /api/ {
        proxy_pass http://tms-api:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routes + index.html — no cache so new deployments are visible immediately
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
    }
}

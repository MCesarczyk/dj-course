components:
  schemas:
    HealthStatus:
      title: HealthStatus
      required:
      - status
      - timestamp
      - uptime_seconds
      - version
      - dependencies
      type: object
      properties:
        status:
          title: Status
          type: string
          description: 'Overall service status: UP or DOWN'
        timestamp:
          title: Timestamp
          type: number
          description: Unix timestamp
        uptime_seconds:
          title: Uptime Seconds
          type: integer
          description: Service uptime in seconds
        version:
          title: Version
          type: string
          description: Application version (from VERSION env var)
        dependencies:
          title: Dependencies
          type: object
          additionalProperties:
            type: string
          description: 'Per-dependency status (e.g. {"postgres": "UP"})'
      description: Service status, uptime and dependency health.
    PaymentList:
      title: PaymentList
      type: array
      items:
        $ref: '#/components/schemas/Payment'
      description: List of payments.
    Payment:
      title: Payment
      required:
      - payment_id
      type: object
      properties:
        payment_id:
          title: Payment Id
          type: integer
        storage_record_id:
          title: Storage Record Id
          anyOf:
          - type: integer
          - type: 'null'
          default: null
        party_id:
          title: Party Id
          anyOf:
          - type: integer
          - type: 'null'
          default: null
        amount:
          title: Amount
          anyOf:
          - type: number
          - type: 'null'
          default: null
        currency:
          title: Currency
          anyOf:
          - type: string
          - type: 'null'
          default: null
        status:
          title: Status
          anyOf:
          - type: string
          - type: 'null'
          default: null
        payment_date:
          title: Payment Date
          anyOf:
          - type: string
          - type: 'null'
          default: null
        external_reference:
          title: External Reference
          anyOf:
          - type: string
          - type: 'null'
          default: null
    StorageRecord:
      title: StorageRecord
      required:
      - recordId
      - requestId
      - partyId
      - shelfId
      - cargoWeight
      - cargoVolume
      - status
      type: object
      properties:
        recordId:
          title: Recordid
          type: string
        requestId:
          title: Requestid
          type: string
        partyId:
          title: Partyid
          type: string
        partyName:
          title: Partyname
          anyOf:
          - type: string
          - type: 'null'
          default: null
        shelfId:
          title: Shelfid
          type: string
        locationCode:
          title: Locationcode
          anyOf:
          - type: string
          - type: 'null'
          default: null
        cargoDescription:
          title: Cargodescription
          anyOf:
          - type: string
          - type: 'null'
          default: null
        cargoWeight:
          title: Cargoweight
          type: number
        cargoVolume:
          title: Cargovolume
          type: number
        entryDate:
          title: Entrydate
          anyOf:
          - type: string
          - type: 'null'
          default: null
        exitDate:
          title: Exitdate
          anyOf:
          - type: string
          - type: 'null'
          default: null
        condition:
          title: Condition
          type: string
          default: GOOD
        status:
          title: Status
          type: string
      description: Full storage-record response (open or closed).
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          title: Error
          type: string
          description: Human-readable error message
      description: Standard error envelope.
    StorageRecordList:
      title: StorageRecordList
      type: array
      items:
        $ref: '#/components/schemas/StorageRecord'
      description: List of storage records.
    RecordStatus:
      title: RecordStatus
      enum:
      - STORED
      - DISPATCHED
      - DAMAGED
      - LOST
      type: string
    StorageEventList:
      title: StorageEventList
      type: array
      items:
        $ref: '#/components/schemas/StorageEvent'
      description: Event history for a storage record.
    StorageEvent:
      title: StorageEvent
      required:
      - event_id
      - storage_record_id
      - event_type_id
      - party_id
      type: object
      properties:
        event_id:
          title: Event Id
          type: integer
        storage_record_id:
          title: Storage Record Id
          type: integer
        event_type_id:
          title: Event Type Id
          type: integer
        event_time:
          title: Event Time
          anyOf:
          - type: string
          - type: 'null'
          default: null
        party_id:
          title: Party Id
          type: integer
        details:
          title: Details
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
          default: null
    ReceiptCreate:
      title: ReceiptCreate
      required:
      - requestId
      - shelfId
      - cargoDescription
      - cargoWeight
      - cargoVolume
      type: object
      properties:
        requestId:
          title: Requestid
          type: string
        shelfId:
          title: Shelfid
          type: string
        cargoDescription:
          title: Cargodescription
          type: string
        cargoWeight:
          title: Cargoweight
          exclusiveMinimum: 0.0
          type: number
        cargoVolume:
          title: Cargovolume
          exclusiveMinimum: 0.0
          type: number
        entryDate:
          title: Entrydate
          anyOf:
          - type: string
          - type: 'null'
          default: null
      description: 'POST /storage/receipts — put goods away on a shelf against a storage
        request.


        The owning party is derived from the request; only the physical facts are

        supplied here.'
    ReservationFulfill:
      title: ReservationFulfill
      type: object
      properties:
        cargoDescription:
          title: Cargodescription
          anyOf:
          - type: string
          - type: 'null'
          default: null
        cargoWeight:
          title: Cargoweight
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          default: null
        cargoVolume:
          title: Cargovolume
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          default: null
        entryDate:
          title: Entrydate
          anyOf:
          - type: string
          - type: 'null'
